name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: python3 scripts/validate_migrations.py
      - run: npm run test
      - run: npm run build

  # Production deploy on push to the default feature branch.
  # Requires repo secrets CLOUDFLARE_API_TOKEN (+ optional CLOUDFLARE_ACCOUNT_ID).
  # Migrations run before wrangler deploy — new schema must exist when the
  # Worker boots (see docs/DEPLOYMENT.md §4).
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/family-vault-pwa-plan-TrvxG'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Reconcile D1 migration history
        run: node scripts/reconcile_remote_migrations.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply family-vault-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure rich Money schema (no data loss)
        run: node scripts/ensure_money_schema.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke health + new routes
        run: |
          set -e
          # Worker publish can lag a few seconds behind wrangler deploy exit.
          expect_auth() {
            path="$1"
            for i in 1 2 3 4 5 6 7 8; do
              code=$(curl -s -o /tmp/probe.json -w "%{http_code}" "https://fam.connect-cloud.workers.dev$path")
              echo "GET $path → $code $(head -c 120 /tmp/probe.json)"
              echo "$code" | grep -Eq '^(401|400)$' && return 0
              sleep 3
            done
            echo "smoke failed for $path (wanted 401/400, not HTML/404)" >&2
            return 1
          }
          for i in 1 2 3 4 5; do
            body=$(curl -fsS https://fam.connect-cloud.workers.dev/api/health || true)
            echo "$body" | grep -q '"ok":true' && break
            sleep 3
            if [ "$i" = 5 ]; then
              echo "health check failed: $body" >&2
              exit 1
            fi
          done
          # New surfaces must exist (401/400 without session is fine; HTML/404 is not).
          expect_auth /api/tags
          expect_auth /api/links
          for path in /api/device-lock/status /api/funds /api/settlements/summary /api/vault/status /api/wishlist /api/finance/overview /api/money/summary; do
            expect_auth "$path"
          done
