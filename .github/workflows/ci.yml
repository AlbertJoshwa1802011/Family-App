name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: python3 scripts/validate_migrations.py
      - run: npm run test
      - run: npm run build

  # Production deploy on push to the default feature branch.
  # Requires repo secrets CLOUDFLARE_API_TOKEN (+ optional CLOUDFLARE_ACCOUNT_ID).
  # Migrations run before wrangler deploy — new schema must exist when the
  # Worker boots (see docs/DEPLOYMENT.md §4).
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/family-vault-pwa-plan-TrvxG'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Reconcile D1 migration history
        run: node scripts/reconcile_remote_migrations.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply family-vault-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke health + new routes
        run: |
          set -e
          for i in 1 2 3 4 5; do
            body=$(curl -fsS https://fam.connect-cloud.workers.dev/api/health || true)
            echo "$body" | grep -q '"ok":true' && break
            sleep 3
            if [ "$i" = 5 ]; then
              echo "health check failed: $body" >&2
              exit 1
            fi
          done
          # New surfaces must exist (401/400 without session is fine; HTML/404 is not).
          code=$(curl -s -o /tmp/tags.json -w "%{http_code}" https://fam.connect-cloud.workers.dev/api/tags)
          echo "GET /api/tags → $code $(cat /tmp/tags.json)"
          echo "$code" | grep -Eq '^(401|400)$'
          code=$(curl -s -o /tmp/links.json -w "%{http_code}" https://fam.connect-cloud.workers.dev/api/links)
          echo "GET /api/links → $code $(cat /tmp/links.json)"
          echo "$code" | grep -Eq '^(401|400)$'
