name: Deploy (production)

# Production deploy pipeline.
# Fires when code lands on `main` (i.e. a PR is merged). Runs the full quality
# gate, applies pending D1 migrations to the production database, then deploys
# the Worker to Cloudflare. Auth is via a Cloudflare API token stored in the
# repo's GitHub Actions secrets — the app's RUNTIME secrets (Google/Resend/
# session) live in Cloudflare itself (`wrangler secret put`), never in CI.
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with Workers Scripts + D1 + KV edit perms
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# See DEPLOY.md for how to create both.

on:
  push:
    branches: ["main"]
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

# Never run two production deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Quality gate — a bad commit must never reach production. Same as `npm run gate`.
      - run: npm run gate

      # Bring the production D1 schema up to date before the new code runs.
      - name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply family-vault-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy the built Worker + assets to Cloudflare.
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
