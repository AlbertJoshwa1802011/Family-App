<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="Securely store your family's important documents and never miss an expiry." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Family Vault" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Family Vault</title>
    <script>
      // No-flash theme: apply the persisted theme before first paint.
      (function () {
        try {
          var t = localStorage.getItem("fv-theme");
          var ok = ["midnight", "ocean", "sunset", "forest", "royal", "daylight"];
          document.documentElement.dataset.theme =
            ok.indexOf(t) !== -1 ? t : "midnight";
        } catch (e) {
          document.documentElement.dataset.theme = "midnight";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
